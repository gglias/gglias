<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
<foreignObject x="0" y="0" width="1200" height="540">
<div xmlns="http://www.w3.org/1999/xhtml" class="card">
<style>
@font-face { font-family: "BG"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 500; }
@font-face { font-family: "IN"; src: url(data:font/woff2;base64,) format("woff2"); font-weight: 500; }
* { box-sizing: border-box; }
.card {
  width: 1200px; height: 540px; border-radius: 28px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle, #dadada 1.3px, transparent 1.6px) 0 0 / 28px 28px, #ffffff;
  border: 1px solid #e7e7e7;
}
.frame { position: relative; padding: 18px 28px; }
.frame::before {
  content: ""; position: absolute; inset: 0; border: 2px solid #0D99FF;
  clip-path: inset(0 100% 100% 0); animation: draw .9s cubic-bezier(.2,.7,.1,1) .9s forwards;
}
.label { position: absolute; left: 0; bottom: calc(100% + 10px); font: 500 17px/1 "IN", Helvetica, Arial, sans-serif; color: #0D99FF; opacity: 0; animation: fade .4s ease 1.5s forwards; }
.h { position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid #0D99FF; transform: scale(0); animation: pop .35s cubic-bezier(.2,.7,.1,1) forwards; }
.tl { left: -6px; top: -6px; animation-delay: 1.45s; } .tr { right: -6px; top: -6px; animation-delay: 1.55s; }
.br { right: -6px; bottom: -6px; animation-delay: 1.65s; } .bl { left: -6px; bottom: -6px; animation-delay: 1.75s; }
.size { position: absolute; left: 50%; top: calc(100% + 14px); padding: 5px 9px; border-radius: 4px; background: #0D99FF; color: #fff; font: 500 15px/1.2 "IN", Helvetica, Arial, sans-serif; white-space: nowrap; opacity: 0; transform: translate(-50%, 6px); animation: rise .4s cubic-bezier(.2,.7,.1,1) 1.85s forwards; }
h1 { margin: 0; font-family: "BG", "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 96px; line-height: .95; letter-spacing: -0.035em; color: #141414; }
.line { display: block; overflow: hidden; padding-bottom: .06em; white-space: nowrap; }
.line > span { display: inline-block; transform: translateY(105%); animation: lineIn .9s cubic-bezier(.2,.7,.1,1) forwards; }
.line:nth-child(2) > span { animation-delay: .12s; } .line:nth-child(3) > span { animation-delay: .24s; }
.ico { display: inline-block; height: .74em; width: auto; margin-right: .12em; vertical-align: -.04em; transform: scale(0) rotate(-20deg); animation: iconPop .6s cubic-bezier(.34,1.56,.64,1) .75s forwards; }
.ico2 { animation-delay: .9s; }
@keyframes lineIn { to { transform: translateY(0); } }
@keyframes draw { to { clip-path: inset(0 0 0 0); } }
@keyframes pop { to { transform: scale(1); } }
@keyframes fade { to { opacity: 1; } }
@keyframes rise { to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes iconPop { to { transform: scale(1) rotate(0); } }
</style>
<div class="frame">
  <span class="label">Hero / Desktop</span>
  <h1>
    <span class="line"><span>I design it in <svg xmlns="http://www.w3.org/2000/svg" class="ico" viewBox="0 0 38 57"><path fill="#F24E1E" d="M19 0H9.5a9.5 9.5 0 0 0 0 19H19z"/><path fill="#FF7262" d="M19 0h9.5a9.5 9.5 0 0 1 0 19H19z"/><path fill="#A259FF" d="M19 19H9.5a9.5 9.5 0 0 0 0 19H19z"/><circle fill="#1ABCFE" cx="28.5" cy="28.5" r="9.5"/><path fill="#0ACF83" d="M9.5 38H19v9.5A9.5 9.5 0 1 1 9.5 38z"/></svg>Figma.</span></span>
    <span class="line"><span>Then I build it</span></span>
    <span class="line"><span>in <svg xmlns="http://www.w3.org/2000/svg" class="ico ico2" viewBox="0 0 24 24"><path fill="#21759B" d="M21.469 6.825c.84 1.537 1.318 3.3 1.318 5.175 0 3.979-2.156 7.456-5.363 9.325l3.295-9.527c.615-1.54.82-2.771.82-3.864 0-.405-.026-.78-.07-1.11m-7.981.105c.647-.03 1.232-.105 1.232-.105.582-.075.514-.93-.067-.899 0 0-1.755.135-2.88.135-1.064 0-2.85-.15-2.85-.15-.585-.03-.661.855-.075.885 0 0 .54.061 1.125.09l1.68 4.605-2.37 7.08L5.354 6.9c.649-.03 1.234-.1 1.234-.1.585-.075.516-.93-.065-.896 0 0-1.746.138-2.874.138-.2 0-.438-.008-.69-.015C4.911 3.15 8.235 1.215 12 1.215c2.809 0 5.365 1.072 7.286 2.833-.046-.003-.091-.009-.141-.009-1.06 0-1.812.923-1.812 1.914 0 .89.513 1.643 1.06 2.531.411.72.89 1.643.89 2.977 0 .915-.354 1.994-.821 3.479l-1.075 3.585-3.9-11.61.001.014zM12 22.784c-1.059 0-2.081-.153-3.048-.437l3.237-9.406 3.315 9.087c.024.053.05.101.078.149-1.12.393-2.325.609-3.582.609M1.211 12c0-1.564.336-3.05.935-4.39L7.29 21.709C3.694 19.96 1.212 16.271 1.211 12M12 0C5.385 0 0 5.385 0 12s5.385 12 12 12 12-5.385 12-12S18.615 0 12 0"/></svg>WordPress.</span></span>
  </h1>
  <span class="h tl"></span><span class="h tr"></span><span class="h bl"></span><span class="h br"></span>
  <span class="size">808 × 327</span>
</div>
</div>
</foreignObject>
</svg>